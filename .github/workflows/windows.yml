name: Windows verification
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, json, zlib, ctype, gd
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make tar autoconf automake libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-poppler
      - uses: actions/cache/restore@v4
        with:
          path: |
            native/downloads
            tests/fonts
            tests/unicode
          key: windows-fixtures-${{ hashFiles('native/sources.lock.json', 'assets/font-packs.json', 'tests/unicode/manifest.json') }}
          restore-keys: windows-fixtures-
      - name: Identify native dependency cache
        id: native-key
        shell: msys2 {0}
        run: echo "key=$(python native/build-dependencies.py --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: native-libraries
        with:
          path: native/prefix
          key: native-libraries-${{ steps.native-key.outputs.key }}
      - name: Build pinned native libraries
        if: steps.native-libraries.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: python native/build-dependencies.py
      - uses: actions/cache/save@v4
        if: steps.native-libraries.outputs.cache-hit != 'true'
        with:
          path: native/prefix
          key: native-libraries-${{ steps.native-key.outputs.key }}
      - name: Build native helper
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$PWD/native/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="$PWD/native/prefix/bin:$PATH"
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --target tinypdf-text tinypdf-test-helper --parallel
      - name: Prepare fonts and fixtures
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$PWD/native/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="$PWD/native/prefix/bin:$PATH"
          composer validate --strict
          composer install --no-interaction --prefer-dist
          php bin/install-fonts.php --tests --unicode
          "$(cygpath -u "$pythonLocation")/python.exe" tests/prepare_formats.py
      - uses: actions/cache/save@v4
        with:
          path: |
            native/downloads
            tests/fonts
            tests/unicode
          key: windows-fixtures-${{ hashFiles('native/sources.lock.json', 'assets/font-packs.json', 'tests/unicode/manifest.json') }}
      - name: Verify PHP integration and failure deadlines
        timeout-minutes: 5
        shell: msys2 {0}
        run: |
          export PATH="$PWD/native/prefix/bin:$PATH"
          php bin/tinypdf-check.php
          composer test
      - name: Verify shaping and Unicode
        shell: msys2 {0}
        run: |
          export PATH="$PWD/native/prefix/bin:$PATH"
          python tests/reference.py
          python tests/unicode_conformance.py
      - name: Verify rendering and extraction
        shell: msys2 {0}
        run: |
          export PATH="$PWD/native/prefix/bin:$PATH"
          "$(cygpath -u "$pythonLocation")/python.exe" tests/rendering.py
          php tests/benchmark.php > tests/performance.json
      - name: Package and verify installed helper
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$PWD/native/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="$PWD/native/prefix/bin:$PATH"
          "$(cygpath -u "$pythonLocation")/python.exe" tests/source_archive.py
          python native/package.py
          "$(cygpath -u "$pythonLocation")/python.exe" tests/package.py "$(find dist -name '*.zip' -type f | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            tests/unicode/results.json
            tests/performance.json
            output/pdf/
          if-no-files-found: error
